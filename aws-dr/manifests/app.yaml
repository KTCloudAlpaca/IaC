# DR 서버(k3s)에 띄울 앱. 온프레 app 네임스페이스와 같은 구성에서
#   - 이미지: 온프레 로컬 이미지 -> ECR
#   - nodeSelector(kubernetes.io/hostname: worker) 제거
# backend-secret(MONGODB_URI) 은 recover.sh 가 SSM 비밀번호로 만들어줌
# aws-bootstrap apply 시 s3://<버킷>/dr-manifests/ 로 업로드됨
# 앱 버전이 바뀌면 아래 이미지 태그를 같이 올려야 함
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: 995342110514.dkr.ecr.ap-northeast-2.amazonaws.com/launcher-backend:v1
          ports:
            - containerPort: 5000
          env:
            - name: PORT
              value: "5000"
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef: { name: backend-secret, key: MONGODB_URI }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          readinessProbe:
            httpGet: { path: /api/health, port: 5000 }
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /api/health, port: 5000 }
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: app
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - port: 5000
      targetPort: 5000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: 995342110514.dkr.ecr.ap-northeast-2.amazonaws.com/launcher-frontend:v1
          ports:
            - containerPort: 80
          env:
            - name: BACKEND_URL
              value: http://backend:5000
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 200m, memory: 64Mi }
          readinessProbe:
            httpGet: { path: /, port: 80 }
            periodSeconds: 5
---
# nginx 가 이 NodePort 로 전달 (온프레와 같은 30080)
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: app
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
