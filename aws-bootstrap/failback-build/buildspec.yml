version: 0.2

phases:
  build:
    commands:
      - |
        set -eu
        aws --version
        RUN_ID="$(date -u +%Y%m%dT%H%M%SZ)-${CODEBUILD_BUILD_NUMBER}"
        echo "Starting controlled failback run ${RUN_ID}"
        cat >/tmp/send-command.json <<JSON
        {
          "Targets": [{"Key":"tag:Name","Values":["${DR_MASTER_TAG_VALUE}"]}],
          "DocumentName": "AWS-RunShellScript",
          "Comment": "Controlled MongoDB failback ${RUN_ID}",
          "TimeoutSeconds": 3600,
          "Parameters": {
            "commands": ["sudo /usr/local/sbin/dr-failback-export.sh '${RUN_ID}' '${FAILBACK_BUCKET}' '${FAILBACK_PREFIX}' '${AWS_DEFAULT_REGION}'"]
          }
        }
        JSON
        COMMAND_ID="$(aws ssm send-command --cli-input-json file:///tmp/send-command.json --query 'Command.CommandId' --output text)"
        echo "SSM CommandId=${COMMAND_ID}"

        START=$(date +%s)
        INSTANCE_ID=""
        while :; do
          ROW=$(aws ssm list-command-invocations --command-id "$COMMAND_ID" --details --query 'CommandInvocations[0].[InstanceId,Status,StatusDetails]' --output text 2>/dev/null || true)
          if [ -n "$ROW" ] && [ "$ROW" != "None\tNone\tNone" ]; then
            INSTANCE_ID=$(printf '%s\n' "$ROW" | awk '{print $1}')
            STATUS=$(printf '%s\n' "$ROW" | awk '{print $2}')
            DETAILS=$(printf '%s\n' "$ROW" | cut -f3-)
            case "$STATUS" in
              Success) echo "Final backup exported by SSM target ${INSTANCE_ID}"; break ;;
              Failed|Cancelled|TimedOut|Cancelling)
                aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" --output json || true
                echo "SSM export failed: ${STATUS} ${DETAILS}"; exit 1 ;;
            esac
          fi
          NOW=$(date +%s)
          if [ $((NOW-START)) -gt 3600 ]; then echo "Timed out waiting for SSM export"; exit 1; fi
          sleep 10
        done

        echo "Waiting for on-prem restore acknowledgement. AWS application writers remain paused until resolved."
        START=$(date +%s)
        while :; do
          if aws s3api head-object --bucket "$FAILBACK_BUCKET" --key "${FAILBACK_PREFIX}/status/${RUN_ID}/SUCCESS" >/dev/null 2>&1; then
            echo "On-prem restore succeeded for run ${RUN_ID}."
            exit 0
          fi
          if aws s3api head-object --bucket "$FAILBACK_BUCKET" --key "${FAILBACK_PREFIX}/status/${RUN_ID}/FAILED" >/dev/null 2>&1; then
            echo "On-prem restore failed. AWS writers remain paused to avoid split-brain. Inspect the on-prem state, then explicitly run dr-failback-resume-aws.sh only after confirming On-Prem writers are fenced."
            exit 1
          fi
          NOW=$(date +%s)
          if [ $((NOW-START)) -gt "$FAILBACK_WAIT_SECONDS" ]; then
            echo "Timed out waiting for on-prem restore acknowledgement. AWS writers remain paused for safety; inspect the run before resuming."
            exit 1
          fi
          sleep 15
        done
