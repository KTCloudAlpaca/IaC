[SERVICE]
    Flush           1
    Daemon          Off
    Log_Level       info
    Parsers_File    /fluent-bit/etc/parsers.conf

[INPUT]
    Name              tail
    Path              /var/log/containers/prometheus-mymonitor-kube-prometheus-prometheus-0_monitor_prometheus-*.log
    Tag               prometheus.logs
    Parser            cri
    DB                /tail-db/prometheus.db
    Refresh_Interval  5
    Read_from_Head    false

[OUTPUT]
    Name    file
    Match   prometheus.logs
    Path    /logs
    File    ${NODE_NAME}-prometheus.log
    Format  plain
